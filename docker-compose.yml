# ============================================================
# Aliyun Guard — Docker Compose 部署文件
# 镜像由 GitHub Actions 自动构建，推送至 GHCR + Docker Hub
#
# 首次部署:
#   1. 复制 .env.example 为 .env，按需修改
#   2. docker compose run --rm aliyun-guard setup
#   3. docker compose up -d
#
# 更新:
#   docker compose pull && docker compose up -d
# ============================================================

services:
  aliyun-guard:
    # 二选一（默认 GHCR，国内机器可换 Docker Hub）
    image: ghcr.io/cold-sword/aliyun-guard:latest
    # image: coldsword/aliyun-guard:latest
    network_mode: bridge
    container_name: aliyun-guard
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ALIYUN_GUARD_CONTAINER: "1"
      ALIYUN_GUARD_CONTAINER_WEB_PORT: "8765"
      ALIYUN_GUARD_HOST_BIND_IP: "${ALIYUN_GUARD_BIND_IP:-127.0.0.1}"
      ALIYUN_GUARD_PUBLIC_WEB_PORT: "${ALIYUN_GUARD_WEB_PORT:-8765}"
      ALIYUN_GUARD_PUBLIC_IP: "${ALIYUN_GUARD_PUBLIC_IP:-}"
    ports:
      - "${ALIYUN_GUARD_BIND_IP:-127.0.0.1}:${ALIYUN_GUARD_WEB_PORT:-8765}:8765"
    volumes:
      - ./docker-data:/data
      - aliyun-guard-bin:/opt/aliyun-guard/bin
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  aliyun-guard-bin:
