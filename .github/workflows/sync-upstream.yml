name: Sync upstream

on:
  schedule:
    # Every 6 hours. GitHub Actions cron uses UTC.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Open PR with upstream changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Felix666-ship-It/aliyun-guard.git
          git fetch upstream main --tags
          git fetch origin main

      - name: Check whether upstream changed
        id: check
        run: |
          behind=$(git rev-list --count origin/main..upstream/main)
          ahead=$(git rev-list --count upstream/main..origin/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          echo "Fork is $behind commits behind upstream and $ahead commits ahead."

      - name: Create sync branch
        if: steps.check.outputs.behind != '0'
        run: |
          git checkout -B sync/upstream-main origin/main
          git merge upstream/main --no-edit
          git push origin sync/upstream-main --force-with-lease
          git push origin --tags

      - name: Open or update pull request
        if: steps.check.outputs.behind != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:sync/upstream-main`;
            const base = 'main';
            const title = 'Sync upstream main';
            const body = [
              'Automated upstream sync from `Felix666-ship-It/aliyun-guard:main`.',
              '',
              `Fork was ${'${{ steps.check.outputs.behind }}'} commits behind upstream when this workflow ran.`,
              '',
              'Review and merge this PR to update the fork safely. If there are conflicts, resolve them here instead of force-syncing `main`.'
            ].join('\n');

            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head,
              base,
            });

            if (pulls.length > 0) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pulls[0].number,
                title,
                body,
              });
              core.info(`Updated existing PR #${pulls[0].number}`);
            } else {
              const { data: pull } = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head,
                base,
                body,
              });
              core.info(`Created PR #${pull.number}`);
            }

      - name: Nothing to sync
        if: steps.check.outputs.behind == '0'
        run: echo "Fork is already up to date with upstream/main."
